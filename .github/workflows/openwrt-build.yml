name: Build OpenWRT firmware targets

on:
  workflow_dispatch:
  push:
    branches: [ dev ]

jobs:
  build:
    name: Build OpenWRT for ${{ matrix.target }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        target:
          - netgear_r6020
          - tplink_tl-wdr4300-v1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: openwrt-builder

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib gettext git libncurses-dev libssl-dev python3-setuptools \
            rsync unzip zlib1g-dev file wget python3 python3-pip libelf-dev ccache \
            qemu-utils

      - name: Run POSIX-compliant build using dash
        run: |
          export BUILD_TARGET="${{ matrix.target }}"
          dash -c '
            cd openwrt-builder
            . build/envsetup.sh
            sync release
            lunch "$BUILD_TARGET"
            sync
            make
            sync snapshot
            lunch "$BUILD_TARGET"
            make
            zip -r "../openwrt-builder-$BUILD_TARGET.zip" out/
          '

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-builder-${{ matrix.target }}
          path: openwrt-builder-${{ matrix.target }}.zip
